[package]
name = "refrata_native"
version = "0.2.0"
edition = "2021"
description = "Refrata's native core: libVLC pictures to Qt's video sinks without Python, HDR10+ reading"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[lib]
name = "refrata_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }

whisper-rs = { version = "0.16", features = ["openmp", "vulkan"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
