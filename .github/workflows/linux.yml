# Linux: the e2e battery on Ubuntu (system libVLC, virtual display, private D-Bus session).
# Same setup as the local test bed in WSL; Windows-only checks skip themselves there.
name: linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System packages (libVLC, Qt's X11 libraries, virtual display, D-Bus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvlc5 vlc-plugin-base vlc-plugin-video-output \
            libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3 libpulse0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 fonts-noto-core xvfb xauth dbus-x11 libglib2.0-bin xdg-utils ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: e2e battery
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" \
            python main.py --selftest --report e2e-linux.json

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux
          path: e2e-linux.json
          if-no-files-found: ignore
