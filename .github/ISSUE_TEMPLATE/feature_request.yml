name: Feature request
description: An idea or suggestion for Refrata.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. Português é bem-vindo.
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation you are in and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: What you imagine Refrata doing. Other players that do it well are useful references.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, mockups, or links.
